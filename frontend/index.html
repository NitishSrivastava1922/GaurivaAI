<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>NexusAI</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#000;color:#e2e8f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .initial-shell{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.9)}
      .initial-card{box-sizing:border-box;width:min(460px,90vw);height:208px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:#13151c;border:1px solid rgba(255,255,255,.08);border-radius:8px}
      .initial-card h1{margin:0;font-size:17px}.initial-card p{margin:4px 0 0;color:#94a3b8;font-size:13px}
      .initial-card button{width:90%;height:40px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:#8b5cf6;color:#e2e8f0;font:500 14px system-ui,-apple-system,sans-serif}
    </style>
  </head>
  <body>
    <div id="root"><main class="initial-shell"><section class="initial-card"><div><h1>Welcome to NexusAI</h1><p>Please log in to continue</p></div><button type="button">Continue with Google</button></section></main></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
